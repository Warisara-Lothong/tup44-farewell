<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TUP 44 Farewell</title>

<link
  href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600&family=Great+Vibes&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   THEME
===================================================== */

:root{

  --bg:#fbeee8;
  --pink:#f4c8cb;
  --card:#ffffff;
  --ink:#4a1010;
  --mauve:#8b6468;
  --rose:#b0525f;
  --line:#cf8a96;
  --ok:#3f9b3f;
  --wait:#e6a72c;
  --bad:#c62a2a;
  --wrap:#faeee9;

}


/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  min-height:100vh;

  background:var(--bg);

  color:var(--ink);

  font-family:
    'Prompt',
    'Noto Sans Thai',
    sans-serif;

  background-image:

    radial-gradient(
      circle at 8% 12%,
      #f7c9d0aa 0 60px,
      transparent 62px
    ),

    radial-gradient(
      circle at 92% 30%,
      #f7c9d088 0 90px,
      transparent 92px
    ),

    radial-gradient(
      circle at 20% 85%,
      #f7c9d077 0 70px,
      transparent 72px
    );

}


/* =====================================================
   TOP BAR
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:16px 22px;

}


.brand{

  font-family:'Mitr';

  font-size:22px;

  color:var(--rose);

  text-shadow:
    2px 2px 0 var(--pink);

}


.brand small{

  display:block;

  font-family:'Prompt';

  font-size:9px;

  letter-spacing:.05em;

  color:var(--ink);

  text-shadow:none;

}


.who{

  font-size:13px;

  color:var(--mauve);

}


.who a{

  color:var(--ink);

  text-decoration:underline;

  cursor:pointer;

  margin-left:8px;

}


/* =====================================================
   MAIN
===================================================== */

main{

  max-width:1000px;

  margin:auto;

  padding:
    10px
    16px
    60px;

}


/* =====================================================
   TYPOGRAPHY
===================================================== */

.title{

  font-family:'Mitr';

  color:var(--rose);

  text-shadow:
    3px 3px 0 var(--pink),
    -1px -1px 0 var(--line);

}


.script{

  font-family:
    'Great Vibes',
    cursive;

  color:var(--rose);

  line-height:1;

}


/* =====================================================
   HERO
===================================================== */

.hero{

  text-align:center;

  padding:
    45px
    0
    30px;

}


.hero .title{

  font-size:
    clamp(
      58px,
      15vw,
      120px
    );

  margin:0;

}


.hero .script{

  font-size:
    clamp(
      70px,
      17vw,
      150px
    );

  margin-top:-10px;

}


.hero p{

  font-size:13px;

  font-weight:600;

  letter-spacing:.12em;

  margin:
    12px
    0
    30px;

}


.crest{

  font-size:55px;

}


/* =====================================================
   BUTTON
===================================================== */

.btn{

  font-family:'Mitr';

  font-size:19px;

  color:white;

  border:0;

  cursor:pointer;

  padding:
    13px
    38px;

  min-width:220px;

  background:
    linear-gradient(
      #e8949e,
      #c97d93
    );

  clip-path:polygon(

    0 8px,
    8px 0,
    calc(100% - 8px) 0,
    100% 8px,
    100% calc(100% - 8px),
    calc(100% - 8px) 100%,
    8px 100%,
    0 calc(100% - 8px)

  );

  box-shadow:
    0 8px 16px #c97d9366;

}


.btn:hover{

  transform:translateY(-2px);

}


.btn.small{

  min-width:0;

  width:100%;

  font-size:15px;

  padding:
    9px
    16px;

}


/* =====================================================
   LOGIN
===================================================== */

.panel{

  max-width:440px;

  margin:
    20px
    auto;

  padding:28px;

  background:var(--wrap);

  border:
    2px solid var(--line);

  border-radius:22px;

}


label{

  display:block;

  margin:
    14px
    0
    6px;

  font-family:'Mitr';

  color:var(--mauve);

}


input{

  width:100%;

  padding:13px 15px;

  border:
    3px solid var(--line);

  border-radius:14px;

  font-family:'Prompt';

  font-size:16px;

  color:var(--ink);

  background:white;

}


.login-note{

  font-size:13px;

  color:var(--mauve);

  margin:
    12px
    0
    18px;

  text-align:center;

}


/* =====================================================
   DASHBOARD GRID
===================================================== */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:38px 20px;

  margin-top:30px;

}


.box{

  position:relative;

  background:var(--card);

  border:
    3px solid var(--line);

  border-radius:20px;

  padding:
    34px
    18px
    18px;

}


.box.wide{

  grid-column:1 / -1;

}


.box h2{

  position:absolute;

  top:-24px;

  left:50%;

  transform:
    translateX(-50%);

  margin:0;

  white-space:nowrap;

  font-family:'Mitr';

  font-size:30px;

  color:var(--rose);

  text-shadow:
    2px 2px 0 var(--pink);

}


.row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:
    8px
    0;

  border-bottom:
    1px dashed var(--line);

  font-size:14px;

}


.row:last-child{

  border-bottom:0;

}


.row b{

  white-space:nowrap;

}


.big{

  text-align:center;

  font-family:'Mitr';

  font-size:
    clamp(
      40px,
      10vw,
      70px
    );

}


.note{

  color:var(--mauve);

  font-size:12px;

  margin-top:8px;

}


/* =====================================================
   TABS
===================================================== */

.tabs{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-bottom:15px;

  flex-wrap:wrap;

}


.tabs button{

  padding:
    8px
    18px;

  border:
    2px solid var(--line);

  border-radius:999px;

  background:white;

  color:var(--ink);

  cursor:pointer;

  font-family:'Prompt';

}


.tabs button.active{

  color:white;

  border-color:transparent;

  background:
    linear-gradient(
      #e8949e,
      #c97d93
    );

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  font-size:14px;

}


th,
td{

  padding:
    9px
    10px;

  border-bottom:
    1px dashed var(--line);

  white-space:nowrap;

  text-align:right;

}


th:first-child,
td:first-child{

  text-align:left;

}


th{

  font-family:'Mitr';

  color:var(--mauve);

}


.dot{

  display:inline-block;

  width:13px;

  height:13px;

  border-radius:50%;

  margin-right:5px;

  vertical-align:-2px;

}


.dot.ok{

  background:var(--ok);

}


.dot.wait{

  background:var(--wait);

}


.dot.bad{

  background:var(--bad);

}


/* =====================================================
   ROOM
===================================================== */

.room-title{

  text-align:center;

  font-family:'Mitr';

  font-size:
    clamp(
      58px,
      15vw,
      95px
    );

  margin:
    20px
    0
    5px;

}


.legend{

  display:flex;

  justify-content:center;

  gap:15px;

  flex-wrap:wrap;

  font-size:13px;

}


.rounds{

  display:grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap:35px 16px;

  margin-top:35px;

}


.rd .box{

  min-height:135px;

  padding-top:30px;

}


.rd .box h2{

  font-size:21px;

  top:-18px;

}


.amount{

  text-align:center;

  font-family:'Mitr';

  font-size:30px;

}


.status{

  text-align:center;

  color:var(--mauve);

  font-size:12px;

  margin-top:5px;

}


.center{

  text-align:center;

  margin-top:35px;

}


/* =====================================================
   UPLOAD
===================================================== */

.upload-name{

  text-align:center;

  font-size:11px;

  color:var(--mauve);

  word-break:break-all;

  margin-top:7px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:720px){

  .grid{

    grid-template-columns:1fr;

  }

  .box.wide{

    grid-column:auto;

  }

  .rounds{

    grid-template-columns:1fr;

  }

  .box h2{

    font-size:25px;

  }

  .brand{

    font-size:18px;

  }

  .brand small{

    font-size:7px;

  }

  .who{

    font-size:11px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP
===================================================== -->

<div class="top">

  <div class="brand">

    TUP 44 Farewell

    <small>
      TRIAMUDOMSAKKAPATANAKRAN SCHOOL
    </small>

  </div>


  <div
    class="who"
    id="who">
  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<main id="app"></main>


<script>

/* =====================================================
   DATA
===================================================== */

const PEOPLE = [

  28,25,26,39,38,
  27,34,33,36,36,
  35,36,36,36,40,
  28,31,38,37,33

];


const RATE = [

  500,
  350,
  350

];


const ROUNDS = [

  {

    date:"23/07/2569",

    time:"08:15",

    amount:PEOPLE.map(
      p => p * RATE[0]
    )

  },

  {

    date:"05/09/2569",

    time:"11:20",

    amount:PEOPLE.map(
      p => p * RATE[1]
    )

  },

  {

    date:"27/09/2569",

    time:"15:45",

    amount:[

      9800,
      8750,
      9100,
      13650,
      13300,
      9450,
      11900,
      null,
      12600,
      12600,
      12250,
      12600,
      11550,
      12600,
      14000,
      null,
      10850,
      13300,
      12950,
      null

    ]

  }

];


const EXPENSES = [

  {

    date:"17/08/2569",

    name:"โฟโต้บูธ",

    unit:7500,

    qty:2,

    paid:5000

  },

  {

    date:"04-05/09/2569",

    name:"วงดนตรี (SCRUBB)",

    unit:120000,

    qty:1,

    paid:60000

  }

];


const EXPENSE_NOTE =
  "โอนค่าวงดนตรีงวดที่ 1 เป็น 2 รอบ รอบละ 30,000 บาท เพราะธนาคารจำกัดโอนไม่เกิน 50,000 บาท/วัน";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let currentRoom = 9;

let selectedRound = 2;


/* =====================================================
   HELPERS
===================================================== */

const app =
  document.getElementById("app");


function money(n){

  return Number(n || 0)
    .toLocaleString("en-US");

}


function total(arr){

  return arr.reduce(
    (a,b) =>
      a + (Number(b) || 0),
    0
  );

}


function incomeTotal(){

  return total(
    ROUNDS.map(
      r => total(r.amount)
    )
  );

}


function expenseTotal(){

  return total(
    EXPENSES.map(
      e => e.paid
    )
  );

}


function balance(){

  return (
    incomeTotal() -
    expenseTotal()
  );

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(
  round,
  room
){

  const amount =
    ROUNDS[round]
      .amount[room];


  if(amount === null){

    return "wait";

  }


  const need =
    PEOPLE[room] *
    RATE[round];


  if(amount >= need){

    return "ok";

  }


  return "bad";

}


function statusText(
  round,
  room
){

  const s =
    getStatus(
      round,
      room
    );


  if(s === "ok"){

    return "ตรวจสอบแล้ว (ครบถ้วน)";

  }


  if(s === "bad"){

    const need =
      PEOPLE[room] *
      RATE[round];

    const amount =
      ROUNDS[round]
        .amount[room];

    const missing =
      Math.ceil(
        (need - amount) /
        RATE[round]
      );

    return "ตรวจสอบแล้ว (ขาด " +
      missing +
      " คน)";

  }


  return "รอการตรวจสอบ";

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

  document.getElementById("who")
    .innerHTML = "";


  app.innerHTML = `

    <section class="hero">

      <div class="crest">
        🌸
      </div>

      <h1 class="title">
        TUP 44
      </h1>

      <div class="script">
        Farewell
      </div>

      <p>
        TRIAMUDOMSAKKAPATANAKRAN SCHOOL
      </p>

      <button
        class="btn"
        id="loginButton">

        เข้าสู่ระบบ

      </button>

    </section>

  `;


  document
    .getElementById("loginButton")
    .onclick =
      showLogin;

}


/* =====================================================
   LOGIN
   ระบบทดลองแบบง่าย
===================================================== */

function showLogin(){

  app.innerHTML = `

    <div
      class="hero"
      style="padding-bottom:0">

      <div
        class="script"
        style="
          font-size:
          clamp(
            55px,
            12vw,
            90px
          )">

        Welcome back

      </div>

      <p>
        TUP 44 FAREWELL
      </p>

    </div>


    <div class="panel">

      <label>
        ชื่อผู้ใช้งาน
      </label>

      <input
        type="text"
        id="username"
        value="วริศรา_6/9"
        placeholder="เช่น วริศรา_6/9"
      >


      <label>
        รหัสผ่าน
      </label>

      <input
        type="password"
        id="password"
        value="123456"
        placeholder="ใส่อะไรก็ได้"
      >


      <div class="login-note">

        ระบบทดลองสำหรับดูหน้าเว็บไซต์<br>

        ตอนนี้สามารถใช้ชื่ออะไรก็ได้<br>

        ระบบจะใช้เลขห้องจากชื่อ เช่น
        <b>วริศรา_6/9</b>

      </div>


      <button
        class="btn"
        id="enter"
        style="width:100%">

        เข้าสู่เว็บไซต์

      </button>

    </div>

  `;


  document
    .getElementById("enter")
    .onclick =
      enterDemo;

}


/* =====================================================
   ENTER DEMO
===================================================== */

function enterDemo(){

  const input =
    document
      .getElementById("username")
      .value
      .trim();


  /*
    ถ้าพิมพ์ ..._6/9
    จะอ่านเลขห้องออกมา

    ถ้าอ่านไม่ได้
    ใช้ห้อง 9 เป็นค่าเริ่มต้น
  */

  const match =
    input.match(
      /6\s*\/\s*(\d{1,2})\s*$/
    );


  if(match){

    const room =
      Number(
        match[1]
      );


    if(
      room >= 1 &&
      room <= 20
    ){

      currentRoom =
        room;

    }

  }


  currentUser =
    input ||
    "วริศรา_6/9";


  showDashboard();

}


/* =====================================================
   HEADER USER
===================================================== */

function updateHeader(){

  const who =
    document.getElementById("who");


  if(!currentUser){

    who.innerHTML = "";

    return;

  }


  who.innerHTML = `

    ห้อง ม.6/${currentRoom}

    <a
      id="logout">

      ออกจากระบบ

    </a>

  `;


  document
    .getElementById("logout")
    .onclick =
      () => {

        currentUser =
          null;

        currentRoom =
          9;

        showHome();

      };

}


/* =====================================================
   DASHBOARD
===================================================== */

function showDashboard(){

  updateHeader();


  const incomes =
    ROUNDS.map(
      r =>
        total(r.amount)
    );


  app.innerHTML = `

    <div
      class="hero"
      style="
        padding:
        20px
        0
        0">

      <h1
        class="title"
        style="
          font-size:
          clamp(
            42px,
            9vw,
            68px
          );
          margin:0">

        TUP 44

        <span
          class="script"
          style="
            font-size:1.25em">

          Farewell

        </span>

      </h1>

    </div>


    <div class="grid">


      <!-- รายรับ -->

      <div class="box">

        <h2>
          รายรับ
        </h2>


        ${ROUNDS.map(

          (r,i) => `

            <div class="row">

              <span>

                รอบที่ ${i+1}

                <br>

                <small>
                  ${r.date}
                </small>

              </span>

              <b>

                ${money(
                  incomes[i]
                )}
                บาท

              </b>

            </div>

          `

        ).join("")}


        <div class="row">

          <b>
            รวม
          </b>

          <b>

            ${money(
              incomeTotal()
            )}

            บาท

          </b>

        </div>


        <div class="note">

          * รอบที่ 3
          ยังไม่ได้ตรวจสอบกับยอดธนาคาร

        </div>

      </div>


      <!-- รายจ่าย -->

      <div class="box">

        <h2>
          รายจ่าย
        </h2>


        ${EXPENSES.map(

          e => `

            <div class="row">

              <span>

                ${e.date}

                <br>

                ${e.name}

                <br>

                <small>

                  ${money(e.unit)}
                  ×
                  ${e.qty}

                  =
                  ${money(
                    e.unit *
                    e.qty
                  )}

                </small>

              </span>


              <b>

                ${money(
                  e.paid
                )}

                บาท

              </b>

            </div>

          `

        ).join("")}


        <div class="row">

          <b>
            รวม
          </b>

          <b>

            ${money(
              expenseTotal()
            )}

            บาท

          </b>

        </div>


        <div class="note">

          ${EXPENSE_NOTE}

        </div>

      </div>


      <!-- BALANCE -->

      <div class="box wide">

        <h2>
          ยอดคงเหลือ
        </h2>


        <div class="big">

          ${money(
            balance()
          )}

          บาท

        </div>


        <div
          class="note"
          style="
            text-align:center">

          ยอดหลังรอบที่ 2
          ที่ตรวจตรงกับธนาคารแล้ว:

          ${money(
            incomes[0] +
            incomes[1] -
            expenseTotal()
          )}

          บาท

        </div>

      </div>

    </div>


    <!-- TABLE -->

    <div
      class="box wide"
      style="
        margin-top:
        38px">

      <h2>
        ยอดเงินทุกห้อง
      </h2>


      <div class="tabs">

        <button
          data-round="0"
          class="${
            selectedRound === 0
              ? "active"
              : ""
          }">

          รอบที่ 1

        </button>


        <button
          data-round="1"
          class="${
            selectedRound === 1
              ? "active"
              : ""
          }">

          รอบที่ 2

        </button>


        <button
          data-round="2"
          class="${
            selectedRound === 2
              ? "active"
              : ""
          }">

          รอบที่ 3

        </button>

      </div>


      <div class="table-wrap">

        ${createTable()}

      </div>

    </div>


    <div class="center">

      <button
        class="btn"
        id="roomButton">

        ยอดเงินของห้อง

      </button>

    </div>

  `;


  document
    .querySelectorAll(
      "[data-round]"
    )
    .forEach(

      button => {

        button.onclick =
          () => {

            selectedRound =
              Number(
                button
                  .dataset
                  .round
              );

            showDashboard();

          };

      }

    );


  document
    .getElementById(
      "roomButton"
    )
    .onclick =
      showRoom;

}


/* =====================================================
   TABLE
===================================================== */

function createTable(){

  const round =
    ROUNDS[
      selectedRound
    ];


  let html = `

    <p
      style="
        text-align:center">

      ${
        selectedRound === 0
          ? "ปิดยอดครั้งที่ 1"
          : selectedRound === 1
            ? "ปิดยอดครั้งที่ 2"
            : "อยู่ระหว่างเก็บยอดครั้งที่ 3"
      }

      <br>

      วันที่
      ${round.date}

      เวลา
      ${round.time}
      น.

    </p>


    <table>

      <thead>

        <tr>

          <th>
            ห้อง
          </th>

          <th>
            จำนวน
          </th>

          <th>
            ยอดเงิน
          </th>

          <th>
            สถานะ
          </th>

        </tr>

      </thead>

      <tbody>

  `;


  PEOPLE.forEach(

    (people,i) => {

      const amount =
        round.amount[i];


      const status =
        getStatus(
          selectedRound,
          i
        );


      html += `

        <tr>

          <td>
            ม.6/${i+1}
          </td>

          <td>
            ${people}
          </td>

          <td>

            ${
              amount === null
                ? "-"
                : money(amount)
            }

          </td>

          <td>

            <span
              class="dot ${status}">
            </span>

            ${statusText(
              selectedRound,
              i
            )}

          </td>

        </tr>

      `;

    }

  );


  html += `

      </tbody>

    </table>

  `;


  return html;

}


/* =====================================================
   ROOM PAGE
===================================================== */

function showRoom(){

  updateHeader();


  const index =
    currentRoom - 1;


  const requiredTotal =
    PEOPLE[index] *
    (
      RATE[0] +
      RATE[1] +
      RATE[2]
    );


  const paidTotal =
    total(
      ROUNDS.map(
        r =>
          r.amount[index]
      )
    );


  app.innerHTML = `

    <h1 class="room-title">

      M.6/${currentRoom}

    </h1>


    <div class="legend">

      <span>

        <i class="dot ok"></i>

        ครบถ้วน

      </span>


      <span>

        <i class="dot wait"></i>

        รอการตรวจสอบ

      </span>


      <span>

        <i class="dot bad"></i>

        ไม่ครบถ้วน

      </span>

    </div>


    <div class="rounds">


      ${ROUNDS.map(

        (round,k) => {

          const amount =
            round.amount[index];


          const status =
            getStatus(
              k,
              index
            );


          return `

            <div class="rd">

              <div class="box">

                <h2>

                  ยอดครั้งที่
                  ${k+1}

                </h2>


                <div class="amount">

                  ${
                    amount === null
                      ? "-"
                      : money(amount)
                  }

                  ${
                    amount === null
                      ? ""
                      : " บาท"
                  }

                </div>


                <div class="status">

                  <span
                    class="
                      dot
                      ${status}
                    ">
                  </span>

                  ${statusText(
                    k,
                    index
                  )}

                </div>

              </div>


              <button
                class="btn small"
                data-upload="${k}">

                อัปโหลดสลิป

              </button>


              <input
                type="file"
                hidden
                accept="
                  image/*,
                  .pdf
                "
                data-file="${k}"
              >


              <div
                class="upload-name"
                id="
                  uploadName${k}
                ">

              </div>

            </div>

          `;

        }

      ).join("")}


    </div>


    <div
      class="rd"
      style="
        margin-top:
        35px">

      <div class="box">

        <h2>
          ยอดรวมทั้งหมด
        </h2>


        <div class="amount"
          style="
            font-size:
            clamp(
              40px,
              10vw,
              68px
            )">

          ${money(
            paidTotal
          )}

          บาท

        </div>


        <div class="status">

          ยอดที่ต้องชำระทั้งหมด

          ${money(
            requiredTotal
          )}

          บาท

          <br>

          จำนวน
          ${PEOPLE[index]}
          คน

        </div>

      </div>

    </div>


    <div class="center">

      <button
        class="btn"
        id="back">

        กลับหน้าหลัก

      </button>

    </div>

  `;


  document
    .getElementById("back")
    .onclick =
      showDashboard;


  document
    .querySelectorAll(
      "[data-upload]"
    )
    .forEach(

      button => {

        button.onclick =
          () => {

            const k =
              Number(
                button
                  .dataset
                  .upload
              );


            const input =
              document.querySelector(
                `[data-file="${k}"]`
              );


            if(input){

              input.click();

            }

          };

      }

    );


  document
    .querySelectorAll(
      "[data-file]"
    )
    .forEach(

      input => {

        input.onchange =
          () => {

            const file =
              input.files[0];


            if(!file){

              return;

            }


            if(
              file.size >
              5 * 1024 * 1024
            ){

              alert(
                "ไฟล์ต้องมีขนาดไม่เกิน 5 MB"
              );

              input.value =
                "";

              return;

            }


            const k =
              Number(
                input
                  .dataset
                  .file
              );


            const output =
              document.getElementById(
                "uploadName" + k
              );


            output.textContent =
              "เลือกไฟล์แล้ว: " +
              file.name;

          };

      }

    );

}


/* =====================================================
   START
===================================================== */

showHome();

</script>

</body>
</html>
