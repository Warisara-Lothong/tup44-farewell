<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TUP 44 Farewell</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f8e9e5;
  --pink:#e9aeb7;
  --pink2:#d98694;
  --dark:#571d25;
  --text:#4b2025;
  --muted:#936d72;
  --white:#fffafa;
  --border:#c98691;
  --green:#4d9b57;
  --yellow:#dca52f;
  --red:#c94b4b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Prompt",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#f4cbd0 0 70px,transparent 72px),
    radial-gradient(circle at 90% 20%,#f2c3ca 0 90px,transparent 92px),
    radial-gradient(circle at 15% 90%,#f2c7cd 0 80px,transparent 82px),
    var(--bg);
}

button,
input,
select{
  font-family:"Prompt",sans-serif;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 25px;
}

.logo{
  font-family:"Mitr";
  font-size:24px;
  font-weight:600;
  color:var(--pink2);
  text-shadow:2px 2px #f3cbd0;
}

.logo small{
  display:block;
  font-family:"Prompt";
  font-size:9px;
  color:var(--dark);
  letter-spacing:.08em;
  text-shadow:none;
}

.user-area{
  font-size:13px;
  color:var(--muted);
}

.user-area a{
  cursor:pointer;
  color:var(--dark);
  text-decoration:underline;
  margin-left:8px;
}

main{
  width:min(1050px,94%);
  margin:auto;
  padding-bottom:60px;
}

.hero{
  text-align:center;
  padding:35px 0;
}

.hero h1{
  margin:0;
  font-family:"Mitr";
  font-size:clamp(60px,15vw,125px);
  color:var(--pink2);
  text-shadow:
    4px 4px #f3cbd0,
    -1px -1px var(--border);
}

.script{
  font-family:"Great Vibes",cursive;
  color:var(--pink2);
  font-size:clamp(70px,16vw,145px);
  line-height:.8;
}

.hero p{
  font-weight:600;
  letter-spacing:.1em;
  font-size:13px;
}

.btn{
  border:none;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#df8f9a,#bb6879);
  padding:13px 35px;
  min-width:220px;
  border-radius:10px;
  font-size:18px;
  font-family:"Mitr";
  box-shadow:0 7px 15px #b86d7b55;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.secondary{
  background:white;
  color:var(--dark);
  border:2px solid var(--border);
  box-shadow:none;
}

.btn.small{
  min-width:0;
  width:100%;
  padding:9px 15px;
  font-size:14px;
}

.panel{
  width:min(470px,100%);
  margin:20px auto;
  padding:30px;
  background:#fff5f2dd;
  border:2px solid var(--border);
  border-radius:22px;
  box-shadow:0 10px 30px #9e596420;
}

.panel h2{
  text-align:center;
  font-family:"Mitr";
  color:var(--dark);
  margin-top:0;
}

label{
  display:block;
  margin:14px 0 6px;
  font-weight:500;
  color:var(--muted);
}

input,
select{
  width:100%;
  padding:12px 14px;
  border:2px solid var(--border);
  border-radius:12px;
  outline:none;
  background:white;
  color:var(--text);
  font-size:15px;
}

input:focus,
select:focus{
  border-color:var(--pink2);
}

.form-buttons{
  margin-top:20px;
  display:grid;
  gap:10px;
}

.info{
  margin:14px 0;
  padding:12px;
  border-radius:12px;
  background:#f7dfe1;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}

.demo-account{
  background:#fff;
  border:1px dashed var(--border);
  border-radius:14px;
  padding:13px;
  text-align:center;
  font-size:13px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:38px 20px;
  margin-top:30px;
}

.box{
  position:relative;
  background:var(--white);
  border:3px solid var(--border);
  border-radius:20px;
  padding:35px 18px 18px;
}

.box.wide{
  grid-column:1/-1;
}

.box h2{
  position:absolute;
  top:-24px;
  left:50%;
  transform:translateX(-50%);
  margin:0;
  white-space:nowrap;
  font-family:"Mitr";
  font-size:28px;
  color:var(--pink2);
  text-shadow:2px 2px #f4cdd1;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px dashed var(--border);
  font-size:14px;
}

.row:last-child{
  border-bottom:none;
}

.big{
  text-align:center;
  font-family:"Mitr";
  font-size:clamp(40px,9vw,70px);
  color:var(--dark);
}

.note{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.tabs button{
  cursor:pointer;
  padding:8px 18px;
  border:2px solid var(--border);
  border-radius:30px;
  background:white;
  color:var(--dark);
}

.tabs button.active{
  color:white;
  background:linear-gradient(135deg,#df8f9a,#bb6879);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,
td{
  padding:9px 10px;
  border-bottom:1px dashed var(--border);
  white-space:nowrap;
}

th{
  color:var(--muted);
  font-family:"Mitr";
}

.dot{
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:50%;
  margin-right:5px;
}

.dot.ok{
  background:var(--green);
}

.dot.wait{
  background:var(--yellow);
}

.dot.bad{
  background:var(--red);
}

.room-title{
  text-align:center;
  font-family:"Mitr";
  font-size:clamp(60px,15vw,100px);
  color:var(--pink2);
  text-shadow:3px 3px #f4cdd1;
  margin:25px 0 0;
}

.legend{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  font-size:13px;
}

.rounds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:35px 16px;
  margin-top:35px;
}

.rd .box{
  min-height:140px;
  padding-top:32px;
}

.rd .box h2{
  font-size:20px;
  top:-18px;
}

.amount{
  text-align:center;
  font-family:"Mitr";
  font-size:30px;
}

.status{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.center{
  text-align:center;
  margin-top:35px;
}

.upload-name{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  word-break:break-all;
}

.back-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:30px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#57232b;
  color:white;
  padding:12px 22px;
  border-radius:30px;
  font-size:13px;
  display:none;
  z-index:1000;
}

@media(max-width:720px){

  .topbar{
    padding:14px;
  }

  .logo{
    font-size:18px;
  }

  .user-area{
    font-size:11px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .box.wide{
    grid-column:auto;
  }

  .rounds{
    grid-template-columns:1fr;
  }

  .box h2{
    font-size:24px;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    TUP 44 Farewell
    <small>
      TRIAMUDOMSAKKAPATANAKRAN SCHOOL
    </small>
  </div>

  <div
    class="user-area"
    id="userArea">
  </div>

</header>

<main id="app"></main>

<div
  class="toast"
  id="toast">
</div>

<script>

/* =========================================================
   DEMO ACCOUNT
========================================================= */

const DEFAULT_ACCOUNT = {
  username:"วริศรา_6/9",
  password:"123456",
  room:9,
  name:"วริศรา"
};


/* =========================================================
   DATA
========================================================= */

const PEOPLE = [
  28,25,26,39,38,
  27,34,33,36,36,
  35,36,36,36,40,
  28,31,38,37,33
];

const RATE = [
  500,
  350,
  350
];

const ROUNDS = [

  {
    date:"23/07/2569",
    time:"08:15",
    amount:PEOPLE.map(
      p => p * 500
    )
  },

  {
    date:"05/09/2569",
    time:"11:20",
    amount:PEOPLE.map(
      p => p * 350
    )
  },

  {
    date:"27/09/2569",
    time:"15:45",
    amount:[
      9800,
      8750,
      9100,
      13650,
      13300,
      9450,
      11900,
      null,
      12600,
      12600,
      12250,
      12600,
      11550,
      12600,
      14000,
      null,
      10850,
      13300,
      12950,
      null
    ]
  }

];

const EXPENSES = [

  {
    date:"17/08/2569",
    name:"โฟโต้บูธ",
    unit:7500,
    qty:2,
    paid:5000
  },

  {
    date:"04-05/09/2569",
    name:"วงดนตรี (SCRUBB)",
    unit:120000,
    qty:1,
    paid:60000
  }

];

const EXPENSE_NOTE =
"โอนค่าวงดนตรีงวดที่ 1 เป็น 2 รอบ รอบละ 30,000 บาท เพราะธนาคารจำกัดโอนไม่เกิน 50,000 บาท/วัน";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentRoom = 9;

let selectedRound = 2;


/* =========================================================
   STORAGE
========================================================= */

function getAccounts(){

  let accounts =
    JSON.parse(
      localStorage.getItem(
        "tup44_accounts"
      ) || "[]"
    );

  /*
    ใส่บัญชีหลักให้เสมอ
  */

  const exists =
    accounts.some(
      a =>
        a.username ===
        DEFAULT_ACCOUNT.username
    );

  if(!exists){

    accounts.push(
      DEFAULT_ACCOUNT
    );

    localStorage.setItem(
      "tup44_accounts",
      JSON.stringify(accounts)
    );

  }

  return accounts;

}


function saveAccounts(accounts){

  localStorage.setItem(
    "tup44_accounts",
    JSON.stringify(accounts)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function money(number){

  return Number(
    number || 0
  ).toLocaleString("en-US");

}


function total(array){

  return array.reduce(
    (sum,value) =>
      sum +
      (Number(value) || 0),
    0
  );

}


function incomeTotal(){

  return total(
    ROUNDS.map(
      r => total(r.amount)
    )
  );

}


function expenseTotal(){

  return total(
    EXPENSES.map(
      e => e.paid
    )
  );

}


function balance(){

  return (
    incomeTotal() -
    expenseTotal()
  );

}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.style.display =
    "block";

  setTimeout(
    () => {
      el.style.display =
        "none";
    },
    2500
  );

}


/* =========================================================
   ROOM STATUS
========================================================= */

function getStatus(
  round,
  room
){

  const amount =
    ROUNDS[round]
      .amount[room];

  if(
    amount === null ||
    amount === undefined
  ){

    return "wait";

  }

  const required =
    PEOPLE[room] *
    RATE[round];

  if(
    amount >= required
  ){

    return "ok";

  }

  return "bad";

}


function statusText(
  round,
  room
){

  const status =
    getStatus(
      round,
      room
    );

  if(status === "ok"){

    return "ตรวจสอบแล้ว (ครบถ้วน)";

  }

  if(status === "bad"){

    return "ยอดไม่ครบ";

  }

  return "รอการตรวจสอบ";

}


/* =========================================================
   HEADER
========================================================= */

function updateHeader(){

  const area =
    document.getElementById(
      "userArea"
    );

  if(!currentUser){

    area.innerHTML =
      "";

    return;

  }

  area.innerHTML = `

    ห้อง ม.6/${currentRoom}

    <a
      id="logout">
      ออกจากระบบ
    </a>

  `;

  document
    .getElementById("logout")
    .onclick =
    logout;

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  currentUser =
    null;

  currentRoom =
    9;

  updateHeader();

  showHome();

}


/* =========================================================
   HOME
========================================================= */

function showHome(){

  updateHeader();

  app.innerHTML = `

    <section class="hero">

      <div
        style="
          font-size:55px">
        🌸
      </div>

      <h1>
        TUP 44
      </h1>

      <div class="script">
        Farewell
      </div>

      <p>
        TRIAMUDOMSAKKAPATANAKRAN SCHOOL
      </p>

      <br>

      <button
        class="btn"
        id="loginButton">

        เข้าสู่ระบบ

      </button>

    </section>

  `;

  document
    .getElementById(
      "loginButton"
    )
    .onclick =
    showLogin;

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

  updateHeader();

  app.innerHTML = `

    <section class="hero">

      <div class="script">
        Welcome
      </div>

      <p>
        TUP 44 FAREWELL
      </p>

    </section>


    <div class="panel">

      <h2>
        เข้าสู่ระบบ
      </h2>


      <div class="demo-account">

        <b>
          บัญชีสำหรับนำเสนอ
        </b>

        <br><br>

        ชื่อผู้ใช้:
        <b>วริศรา_6/9</b>

        <br>

        รหัสผ่าน:
        <b>123456</b>

      </div>


      <label>
        ชื่อผู้ใช้
      </label>

      <input
        id="loginUsername"
        value="วริศรา_6/9"
        autocomplete="username"
      >


      <label>
        รหัสผ่าน
      </label>

      <input
        id="loginPassword"
        type="password"
        value="123456"
        autocomplete="current-password"
      >


      <div class="form-buttons">

        <button
          class="btn"
          id="loginSubmit">

          เข้าสู่ระบบ

        </button>


        <button
          class="btn secondary"
          id="registerButton">

          ลงทะเบียนบัญชีใหม่

        </button>

      </div>


      <div class="info">

        สำหรับการนำเสนอเว็บไซต์
        ระบบนี้ใช้ข้อมูลทดลอง
        เพื่อให้สามารถสาธิต
        การเข้าสู่ระบบและการลงทะเบียนได้

      </div>

    </div>

  `;


  document
    .getElementById(
      "loginSubmit"
    )
    .onclick =
    login;


  document
    .getElementById(
      "registerButton"
    )
    .onclick =
    showRegister;

}


/* =========================================================
   LOGIN FUNCTION
========================================================= */

function login(){

  const username =
    document
      .getElementById(
        "loginUsername"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const accounts =
    getAccounts();


  const account =
    accounts.find(
      a =>
        a.username === username &&
        a.password === password
    );


  if(!account){

    alert(
      "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
    );

    return;

  }


  currentUser =
    account.username;

  currentRoom =
    Number(
      account.room
    ) || 9;


  toast(
    "เข้าสู่ระบบสำเร็จ"
  );


  setTimeout(
    () => {
      showDashboard();
    },
    300
  );

}


/* =========================================================
   REGISTER
========================================================= */

function showRegister(){

  updateHeader();

  app.innerHTML = `

    <section class="hero">

      <div class="script">
        Register
      </div>

      <p>
        สร้างบัญชีสำหรับผู้ดูแลห้อง
      </p>

    </section>


    <div class="panel">

      <h2>
        ลงทะเบียน
      </h2>


      <label>
        ชื่อ - นามสกุล
      </label>

      <input
        id="registerName"
        placeholder="เช่น วริศรา โหลทอง"
      >


      <label>
        ชื่อผู้ใช้
      </label>

      <input
        id="registerUsername"
        placeholder="เช่น วริศรา_6/9"
      >


      <label>
        ห้อง
      </label>

      <select
        id="registerRoom">

        ${Array.from(
          {length:20},
          (_,i) => `

            <option
              value="${i+1}"
              ${i+1 === 9 ? "selected" : ""}>

              ม.6/${i+1}

            </option>

          `
        ).join("")}

      </select>


      <label>
        รหัสผ่าน
      </label>

      <input
        id="registerPassword"
        type="password"
        placeholder="อย่างน้อย 6 ตัวอักษร"
      >


      <label>
        ยืนยันรหัสผ่าน
      </label>

      <input
        id="registerConfirm"
        type="password"
        placeholder="กรอกรหัสผ่านอีกครั้ง"
      >


      <div class="form-buttons">

        <button
          class="btn"
          id="registerSubmit">

          ลงทะเบียน

        </button>


        <button
          class="btn secondary"
          id="backLogin">

          กลับไปหน้าเข้าสู่ระบบ

        </button>

      </div>


      <div class="info">

        ตัวอย่างบัญชีที่ตั้งไว้สำหรับการนำเสนอ:

        <br>

        <b>วริศรา_6/9</b>
        /
        <b>123456</b>

      </div>

    </div>

  `;


  document
    .getElementById(
      "registerSubmit"
    )
    .onclick =
    register;


  document
    .getElementById(
      "backLogin"
    )
    .onclick =
    showLogin;

}


/* =========================================================
   REGISTER FUNCTION
========================================================= */

function register(){

  const name =
    document
      .getElementById(
        "registerName"
      )
      .value
      .trim();

  const username =
    document
      .getElementById(
        "registerUsername"
      )
      .value
      .trim();

  const room =
    Number(
      document
        .getElementById(
          "registerRoom"
        )
        .value
    );

  const password =
    document
      .getElementById(
        "registerPassword"
      )
      .value;

  const confirm =
    document
      .getElementById(
        "registerConfirm"
      )
      .value;


  if(!name){

    alert(
      "กรุณากรอกชื่อ - นามสกุล"
    );

    return;

  }


  if(!username){

    alert(
      "กรุณากรอกชื่อผู้ใช้"
    );

    return;

  }


  if(!password){

    alert(
      "กรุณากรอกรหัสผ่าน"
    );

    return;

  }


  if(password.length < 6){

    alert(
      "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"
    );

    return;

  }


  if(password !== confirm){

    alert(
      "รหัสผ่านไม่ตรงกัน"
    );

    return;

  }


  const accounts =
    getAccounts();


  const exists =
    accounts.some(
      a =>
        a.username
          .toLowerCase() ===
        username.toLowerCase()
    );


  if(exists){

    alert(
      "ชื่อผู้ใช้นี้มีอยู่แล้ว"
    );

    return;

  }


  accounts.push({

    username:username,

    password:password,

    room:room,

    name:name

  });


  saveAccounts(
    accounts
  );


  alert(
    "ลงทะเบียนสำเร็จ!"
  );


  document
    .getElementById(
      "loginUsername"
    );

  showLogin();


  setTimeout(
    () => {

      const userInput =
        document
          .getElementById(
            "loginUsername"
          );

      const passInput =
        document
          .getElementById(
            "loginPassword"
          );

      if(userInput){

        userInput.value =
          username;

      }

      if(passInput){

        passInput.value =
          password;

      }

    },
    50
  );

}

/* =========================================================
   TABLE
========================================================= */

function createTable(){

  const round =
    ROUNDS[
      selectedRound
    ];


  let html = `

    <p
      style="
        text-align:center;
        color:var(--muted)">

      วันที่ ${round.date}
      เวลา ${round.time} น.

    </p>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              ห้อง
            </th>

            <th>
              จำนวน
            </th>

            <th>
              ยอดเงิน
            </th>

            <th>
              สถานะ
            </th>

          </tr>

        </thead>

        <tbody>

  `;


  PEOPLE.forEach(
    (people,i) => {

      const amount =
        round.amount[i];

      const status =
        getStatus(
          selectedRound,
          i
        );


      html += `

        <tr>

          <td>
            ม.6/${i+1}
          </td>

          <td>
            ${people}
          </td>

          <td>
            ${
              amount === null
                ? "-"
                : money(amount)
            }
          </td>

          <td>

            <span
              class="dot ${status}">
            </span>

            ${statusText(
              selectedRound,
              i
            )}

          </td>

        </tr>

      `;

    }
  );


  html += `

        </tbody>

      </table>

    </div>

  `;


  return html;

}


/* =========================================================
   ROOM PAGE
========================================================= */

function showRoom(){

  updateHeader();


  const roomIndex =
    currentRoom - 1;


  const totalPaid =
    total(
      ROUNDS.map(
        r =>
          r.amount[
            roomIndex
          ]
      )
    );


  const totalRequired =
    PEOPLE[roomIndex] *
    (
      RATE[0] +
      RATE[1] +
      RATE[2]
    );


  app.innerHTML = `

    <div
      class="room-title">

      M.6/${currentRoom}

    </div>


    <div class="legend">

      <span>
        <i class="dot ok"></i>
        ครบถ้วน
      </span>

      <span>
        <i class="dot wait"></i>
        รอตรวจสอบ
      </span>

      <span>
        <i class="dot bad"></i>
        ไม่ครบ
      </span>

    </div>


    <div class="rounds">


      ${ROUNDS.map(
        (round,k) => {

          const amount =
            round.amount[
              roomIndex
            ];

          const status =
            getStatus(
              k,
              roomIndex
            );


          return `

            <div class="rd">

              <div class="box">

                <h2>
                  ยอดครั้งที่ ${k+1}
                </h2>


                <div class="amount">

                  ${
                    amount === null
                      ? "-"
                      : money(amount)
                  }

                  ${
                    amount === null
                      ? ""
                      : " บาท"
                  }

                </div>


                <div class="status">

                  <span
                    class="dot ${status}">
                  </span>

                  ${statusText(
                    k,
                    roomIndex
                  )}

                </div>

              </div>


              <br>


              <button
                class="btn small"
                data-upload="${k}">

                อัปโหลดสลิป

              </button>


              <input
                hidden
                type="file"
                accept="image/*,.pdf"
                data-file="${k}"
              >


              <div
                class="upload-name"
                id="fileName${k}">

              </div>

            </div>

          `;

        }
      ).join("")}


    </div>


    <div
      class="box"
      style="
        margin-top:40px">

      <h2>
        สรุปห้อง
      </h2>


      <div class="big">

        ${money(totalPaid)}

        <span
          style="
            font-size:25px">

          บาท

        </span>

      </div>


      <div
        style="
          text-align:center;
          color:var(--muted)">

        จากยอดที่ต้องชำระ
        ${money(totalRequired)}
        บาท

        <br>

        จำนวน
        ${PEOPLE[roomIndex]}
        คน

      </div>

    </div>


    <div class="back-buttons">

      <button
        class="btn"
        id="dashboardButton">

        กลับ Dashboard

      </button>

    </div>

  `;


  document
    .getElementById(
      "dashboardButton"
    )
    .onclick =
    showDashboard;


  document
    .querySelectorAll(
      "[data-upload]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            const round =
              button.dataset.upload;

            document
              .querySelector(
                `[data-file="${round}"]`
              )
              .click();

          };

      }
    );


  document
    .querySelectorAll(
      "[data-file]"
    )
    .forEach(
      input => {

        input.onchange =
          () => {

            const file =
              input.files[0];

            if(!file){

              return;

            }


            const round =
              input.dataset.file;


            document
              .getElementById(
                "fileName" + round
              )
              .textContent =
              "เลือกไฟล์แล้ว: " +
              file.name;


            /*
              โหมด Demo:
              จำชื่อไฟล์ไว้ในเครื่อง
            */

            localStorage.setItem(
              "slip_room_" +
              currentRoom +
              "_" +
              round,

              file.name
            );


            toast(
              "เลือกสลิปสำเร็จ"
            );

          };

      }
    );


}
